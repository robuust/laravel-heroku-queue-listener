name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the changelog version
        uses: actions/github-script@v7
        with:
          script: |
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'CHANGELOG.md',
              ref: context.sha,
            });
            const changelog = Buffer.from(file.content, file.encoding).toString('utf8');
            const header = changelog.match(/^## (\d+\.\d+\.\d+) \(\d{2}-\d{2}-\d{4}\)\r?\n/);
            if (!header) throw new Error('The changelog must start with a release version and date.');

            const tag = `v${header[1]}`;
            const notes = changelog.slice(header[0].length).split(/^## /m)[0].trim();
            if (!notes) throw new Error('Release notes must not be empty.');

            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.info(`${tag} is already released; nothing to publish.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let existingTag;
            try {
              existingTag = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existingTag) throw new Error(`${tag} already exists without a release; reconcile it manually.`);

            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body: notes,
              draft: false,
              prerelease: false,
            });
            core.info(release.html_url);
